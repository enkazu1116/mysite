# Frontend の速い CI（Lint → TypeCheck → Build）
# モノレポのため install はリポジトリルート、実行は --filter frontend
name: ci-frontend

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: Lint, TypeCheck and Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # version は書かない（package.json の packageManager: pnpm@11.0.0 を使う）
      # @v5 = Action 自体のランタイムが Node 24（@v4 の Node 20 非推奨回避）
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 速いチェックを先に（失敗時に重い build を走らせない）
      - name: Lint frontend
        run: pnpm --filter frontend lint

      - name: TypeCheck frontend
        run: pnpm --filter frontend typecheck

      - name: Build frontend
        run: pnpm --filter frontend build
