# Frontend の速い CI（まずは Build まで）
# モノレポのため install はリポジトリルート、実行は --filter frontend
name: ci-frontend

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json の packageManager (pnpm@11.0.0) を Corepack で使う
      # pnpm/action-setup の version 指定と二重になって ERR になるのを避ける
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build
