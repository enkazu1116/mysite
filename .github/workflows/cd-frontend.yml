# Frontend CD: Firebase Hosting のみ（Cloud Run は別 pipeline）
# 認証: Workload Identity Federation（鍵ファイルなし）
name: cd-frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/cd-frontend.yml"
  workflow_dispatch:

concurrency:
  group: cd-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-hosting:
    name: Build and deploy Hosting
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Deploy to Firebase Hosting
        # frontend の package.json に pnpm の devEngines があるため npx は使わない
        run: pnpm dlx firebase-tools@15 deploy --only hosting --project "${FIREBASE_PROJECT_ID}" --non-interactive --config frontend/firebase.json
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
