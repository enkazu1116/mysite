# Integration CI: ローカル D1 + Google Books
name: ci-integration

on:
  push:
    paths:
      - "backend/**"
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/ci-integration.yml"
  workflow_dispatch:

concurrency:
  group: ci-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  books-google-d1:
    name: Books IT (Google Books + D1)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Ensure BOOKS_API is present
        env:
          BOOKS_API: ${{ secrets.BOOKS_API }}
        run: |
          if [ -z "${BOOKS_API}" ]; then
            echo "::error::BOOKS_API が未設定です。GitHub Actions のシークレットを確認してください。"
            exit 1
          fi

      - name: Integration test backend
        working-directory: backend
        env:
          BOOKS_API: ${{ secrets.BOOKS_API }}
        run: bun run test:integration
