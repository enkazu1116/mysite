# Integration CI: Infisical → Turso + Google Books
name: ci-integration

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci-integration.yml"
  workflow_dispatch:

concurrency:
  group: ci-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  books-google-turso:
    name: Books IT (Infisical → Google Books + Turso)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          domain: https://app.infisical.com

      - name: Ensure Infisical secrets are present
        run: |
          missing=0
          for name in TURSO_DATABASE_URL TURSO_AUTH_TOKEN BOOKS_API; do
            if [ -z "${!name}" ]; then
              echo "::error::$name が未設定です。Infisical 環境 ${{ vars.INFISICAL_ENV_SLUG }} と OIDC Identity を確認してください。"
              missing=1
            fi
          done
          exit "$missing"

      - name: Sync Turso schema
        working-directory: backend
        run: bun run db:push:ci

      - name: Integration test backend
        working-directory: backend
        run: bun run test:integration:ci
