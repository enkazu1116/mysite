# E2E: Frontend + Workers（MSW なし / ローカル D1 + Google Books）
name: ci-e2e

on:
  push:
    paths:
      - "frontend/**"
      - "backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/ci-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ci-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Ensure BOOKS_API is present
        env:
          BOOKS_API: ${{ secrets.BOOKS_API }}
        run: |
          if [ -z "${BOOKS_API}" ]; then
            echo "::error::BOOKS_API が未設定です。GitHub Actions のシークレットを確認してください。"
            exit 1
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          CI: true
          VITE_E2E: "1"
          BOOKS_API: ${{ secrets.BOOKS_API }}
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
