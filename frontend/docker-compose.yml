services:
  frontend:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/frontend
      - node_modules:/frontend/node_modules
    working_dir: /frontend
    command: ["pnpm", "exec", "vite", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      NODE_ENV: development

volumes:
  node_modules:
